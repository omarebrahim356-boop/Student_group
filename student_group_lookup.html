<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>البحث عن جروب الطالب</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card-bg: #ffffff;
    --text: #1a2233;
    --muted: #64708a;
    --accent: #1a3d6d;
    --accent-2: #2f6fd6;
    --border: #e1e6f0;
    --row-alt: #f0f3f8;
    --success-bg: #e9f3ec;
    --success-text: #1e6b3c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151c;
      --card-bg: #1b1f2a;
      --text: #e8ecf5;
      --muted: #9aa4bd;
      --accent: #7fa8e8;
      --accent-2: #4d84d6;
      --border: #2b3142;
      --row-alt: #20242f;
      --success-bg: #163823;
      --success-text: #7fe0a1;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151c;
    --card-bg: #1b1f2a;
    --text: #e8ecf5;
    --muted: #9aa4bd;
    --accent: #7fa8e8;
    --accent-2: #4d84d6;
    --border: #2b3142;
    --row-alt: #20242f;
    --success-bg: #163823;
    --success-text: #7fe0a1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 {
    font-size: 22px;
    text-align: center;
    margin: 4px 0 4px;
    color: var(--accent);
  }
  p.sub {
    text-align: center;
    color: var(--muted);
    margin: 0 0 22px;
    font-size: 14px;
  }
  .search-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  input#q {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text);
    outline: none;
  }
  input#q:focus { border-color: var(--accent-2); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  #results { margin-top: 18px; display: flex; flex-direction: column; gap: 12px; }
  .student-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .student-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .student-name { font-size: 16px; font-weight: 700; color: var(--text); }
  .student-id { font-size: 13px; color: var(--muted); direction: ltr; unicode-bidi: embed; }
  table.grp-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.grp-table th, table.grp-table td {
    text-align: right;
    padding: 7px 8px;
  }
  table.grp-table thead th {
    color: var(--muted);
    font-weight: 600;
    font-size: 12px;
    border-bottom: 1px solid var(--border);
  }
  table.grp-table tbody tr:nth-child(odd) { background: var(--row-alt); border-radius: 8px; }
  .grp-badge {
    display: inline-block;
    min-width: 26px;
    padding: 3px 8px;
    background: var(--success-bg);
    color: var(--success-text);
    border-radius: 999px;
    font-weight: 700;
    font-size: 13px;
    text-align: center;
    direction: ltr;
  }
  .grp-badge.multi { background: #fbe9e7; color: #b3401c; }
  :root[data-theme="dark"] .grp-badge.multi,
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .grp-badge.multi { background: #3a2318; color: #ffb08a; } }
  .empty-msg, .no-results {
    text-align: center;
    color: var(--muted);
    padding: 30px 10px;
    font-size: 14px;
  }
  .count-tag {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 14px;
  }
</style>
</head>

const courseOrder = DATA.course_order;
const courseNames = DATA.course_names;
const students = DATA.students;

const qInput = document.getElementById('q');
const resultsEl = document.getElementById('results');
const countTag = document.getElementById('countTag');

function norm(s) {
  return (s || '').toString().toLowerCase().trim();
}

function renderEmpty() {
  resultsEl.innerHTML = '<div class="empty-msg">ابدأ بكتابة اسمك أو رقمك الأكاديمي فوق</div>';
  countTag.textContent = '';
}

function renderStudent(s) {
  const rows = courseOrder
    .filter(code => s.courses[code])
    .map(code => {
      const groups = s.courses[code];
      const isMulti = groups.length > 1;
      const badge = groups
        .map(g => `<span class="grp-badge${isMulti ? ' multi' : ''}">${g}</span>`)
        .join(' ');
      return `<tr><td>${courseNames[code] || code} <span style="color:var(--muted);font-size:12px;">(${code})</span></td><td style="text-align:left">${badge}</td></tr>`;
    })
    .join('');

  return `
    <div class="student-card">
      <div class="student-head">
        <div class="student-name">${escapeHtml(s.name)}</div>
        <div class="student-id">${escapeHtml(s.id)}</div>
      </div>
      <table class="grp-table">
        <thead><tr><th>المادة</th><th style="text-align:left">الجروب</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function escapeHtml(str) {
  return (str || '').toString()
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function doSearch() {
  const q = norm(qInput.value);
  if (!q) { renderEmpty(); return; }

  const matches = students.filter(s => {
    return norm(s.name).includes(q) || norm(s.id).includes(q);
  }).slice(0, 40);

  if (matches.length === 0) {
    resultsEl.innerHTML = '<div class="no-results">مفيش نتيجة بالاسم أو الآيدي ده. جرب تتأكد من الإملاء أو اكتب جزء من الاسم بس.</div>';
    countTag.textContent = '';
    return;
  }

  resultsEl.innerHTML = matches.map(renderStudent).join('');
  countTag.textContent = matches.length === 1
    ? 'نتيجة واحدة'
    : `${matches.length} نتيجة${matches.length >= 40 ? ' (فيه نتايج تانية، حدد أكتر)' : ''}`;
}

qInput.addEventListener('input', doSearch);
renderEmpty();
</script>
</body>
</html>
